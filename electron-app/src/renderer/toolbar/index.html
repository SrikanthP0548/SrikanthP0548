<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'" />
  <title>Recording Toolbar</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="toolbar">
    <div class="rec-indicator">
      <span class="rec-dot"></span>
      <span id="timer">00:00</span>
    </div>
    <div class="separator"></div>
    <button id="pause-btn" class="tool-btn" title="Pause">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><rect x="3" y="2" width="4" height="12" rx="1"/><rect x="9" y="2" width="4" height="12" rx="1"/></svg>
    </button>
    <button id="resume-btn" class="tool-btn" title="Resume" hidden>
      <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M4 2l10 6-10 6z"/></svg>
    </button>
    <button id="mute-btn" class="tool-btn" title="Mute Mic">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M8 1a2 2 0 0 1 2 2v5a2 2 0 1 1-4 0V3a2 2 0 0 1 2-2zM4 7a4 4 0 0 0 8 0h1a5 5 0 0 1-4.5 4.975V14h3v1h-7v-1h3v-2.025A5 5 0 0 1 3 7h1z"/></svg>
    </button>
    <button id="mute-btn-muted" class="tool-btn muted" title="Unmute Mic" hidden>
      <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M8 1a2 2 0 0 1 2 2v5a2 2 0 1 1-4 0V3a2 2 0 0 1 2-2zM4 7a4 4 0 0 0 8 0h1a5 5 0 0 1-4.5 4.975V14h3v1h-7v-1h3v-2.025A5 5 0 0 1 3 7h1z"/><line x1="2" y1="2" x2="14" y2="14" stroke="currentColor" stroke-width="2"/></svg>
    </button>
    <div class="separator"></div>
    <button id="stop-btn" class="tool-btn stop-btn" title="Stop Recording">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><rect x="3" y="3" width="10" height="10" rx="2"/></svg>
    </button>
  </div>
  <script src="../../../dist/renderer/toolbar/index.js"></script>
</body>
</html>
